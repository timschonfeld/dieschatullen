# Pages CMS (https://pagescms.org): Bearbeitungsoberfläche im Browser für die Inhalte in src/data/.
# Anmelden (GitHub oder Einladung per E-Mail) → Repository wählen → Branch wählen → Inhalte bearbeiten → "Speichern" löst den Deploy aus.
media:
  input: src/assets/img
  output: src/assets/img
  extensions: [jpg, jpeg, png, webp]
  rename: safe # Dateinamen ohne Leerzeichen/Umlaute

content:
  - name: allgemein
    label: "⚓ Allgemein & Winterpause"
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: saison
        label: Saison
        type: object
        fields:
          - { name: winterpause, label: "Winterpause sofort an (manuell)", type: boolean }
          - { name: winterpauseVon, label: "Winterpause automatisch ab (Datum)", type: date }
          - { name: winterpauseBis, label: "Winterpause bis einschließlich (Datum)", type: date }
          - { name: hinweis, label: "Hinweis-Banner oben auf der Startseite (leer = aus)", type: string }
      - name: ausnahmen
        label: "Zusätzliche Schließtage (z. B. Feiertage)"
        type: object
        list: true
        fields:
          - { name: datum, label: Datum, type: date }
      - { name: email, label: E-Mail, type: string }
      - { name: youtube, label: YouTube-Kanal, type: string }
      - { name: name, label: Name, type: string }
      - { name: claim, label: Claim, type: string }
      - { name: beschreibung, label: "Beschreibung für Google", type: text }
      - name: consent
        label: "Einwilligungs-Banner (CCM19)"
        type: object
        fields:
          - { name: skriptUrl, label: "Integrations-URL aus CCM19 (leer = kein Banner)", type: string }

  - name: slider
    label: "🖼️ Slider Startseite"
    type: file
    path: src/data/slider.json
    format: json
    list: true
    fields:
      - { name: bild, label: Bild, type: image }
      - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - { name: titel, label: "Bildunterschrift Deutsch", type: string }
      - { name: titel_en, label: "Bildunterschrift Englisch", type: string }
      - { name: titel_nl, label: "Bildunterschrift Niederländisch", type: string }

  - name: bilder
    label: "📷 Bilder auf den Seiten"
    type: file
    path: src/data/bilder.json
    format: json
    fields:
      - name: startseite
        label: "Startseite"
        type: object
        fields:
          - name: ladenHooksiel
            label: "Laden Hooksiel (großes Bild bei „Unsere Läden“, auch EN/NL)"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: ladenSchillig
            label: "Laden Schillig (großes Bild bei „Unsere Läden“, auch EN/NL)"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: rundgangHooksiel
            label: "Vorschaubild 360°-Rundgang Hooksiel"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
          - name: rundgangSchillig
            label: "Vorschaubild 360°-Rundgang Schillig"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
          - name: drachen
            label: "Breites Bild hinter „Drachen“"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: fotostreifen
            label: "Fotostreifen (laufendes Band, Reihenfolge per Ziehen)"
            type: image
            options:
              multiple: { max: 14 }
              unique: true
          - name: team
            label: "Team-Bild (Über uns & Jobs)"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: sortiment
        label: "Seite Sortiment"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: drachen
        label: "Seite Drachen & Drachenreparatur"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: kinderdrachen
            label: "Karte Kinderdrachen"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: lenkdrachen
            label: "Karte Lenkdrachen"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: lenkmatten
            label: "Karte Lenkmatten"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: reparatur
            label: "Bild bei Drachenreparatur"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: videos
        label: "Seite Videos"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: ueberUns
        label: "Seite Über uns"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: nicky
            label: "Foto Nicky"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
          - name: nadja
            label: "Foto Nadja"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: jobs
        label: "Seite Jobs"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: faq
        label: "Seite FAQ"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: kontakt
        label: "Seite Kontakt"
        type: object
        fields:
          - name: kopf
            label: "Großes Bild oben"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }
              - { name: alt, label: "Bildbeschreibung (was ist zu sehen?)", type: string }
      - name: englischNiederlaendisch
        label: "Englische & niederländische Seite"
        type: object
        fields:
          - name: sortiment
            label: "Bild neben der Sortiment-Liste"
            type: object
            fields:
              - { name: bild, label: Bild, type: image }

  - name: laeden
    label: "🏠 Läden & Öffnungszeiten"
    type: file
    path: src/data/laeden.json
    format: json
    list: true
    fields:
      - { name: id, label: "ID (nicht ändern)", type: string }
      - { name: name, label: Name, type: string }
      - { name: kurz, label: Kurzname, type: string }
      - { name: strasse, label: Straße, type: string }
      - { name: plz, label: PLZ, type: string }
      - { name: ort, label: Ort, type: string }
      - { name: telefon, label: Telefon, type: string }
      - { name: seit, label: "Geöffnet seit (Jahr)", type: number }
      - { name: text, label: Beschreibung, type: text }
      - { name: besonderheiten, label: "Besonderheiten (Schlagworte)", type: string, list: true }
      - { name: gutZuWissen, label: "Gut zu wissen", type: string, list: true }
      - name: oeffnungszeiten
        label: Öffnungszeiten
        type: object
        list: true
        fields:
          - { name: label, label: "Tage (Text), z. B. Montag bis Freitag", type: string }
          - { name: tage, label: "Tage als Zahlen (0 = Sonntag, 1 = Montag … 6 = Samstag)", type: number, list: true }
          - { name: von, label: "Von (HH:MM)", type: string }
          - { name: bis, label: "Bis (HH:MM)", type: string }
      - { name: instagram, label: Instagram, type: string }
      - { name: facebook, label: Facebook, type: string }
      - { name: googleCid, label: "Google-Profil-ID (nicht ändern)", type: string }
      - { name: rundgang, label: "360°-Rundgang (Embed-Link)", type: string }
      - { name: lat, label: Breitengrad, type: number }
      - { name: lon, label: Längengrad, type: number }

  - name: news
    label: "📣 Aktuelles"
    type: file
    path: src/data/news.json
    format: json
    list: true
    fields:
      - { name: titel, label: Titel, type: string }
      - { name: datum, label: Datum, type: date }
      - { name: ende, label: "Ausblenden nach (Datum, optional)", type: date }
      - { name: text, label: Text, type: text }
      - { name: link, label: "Link (optional)", type: string }

  - name: jobs
    label: "🧑‍🤝‍🧑 Jobs"
    type: file
    path: src/data/jobs.json
    format: json
    fields:
      - { name: aktiv, label: "Wir suchen gerade (Hinweis auf der Startseite)", type: boolean }
      - { name: titel, label: Überschrift, type: string }
      - { name: text, label: Text, type: text }
      - { name: gesucht, label: "Gesucht (Schlagworte)", type: string, list: true }
      - { name: email, label: "Bewerbungen an", type: string }

  - name: videos
    label: "🎬 Videos"
    type: file
    path: src/data/videos.json
    format: json
    list: true
    fields:
      - { name: id, label: "YouTube-ID (Teil nach watch?v=)", type: string }
      - { name: titel, label: Titel, type: string }
      - { name: thema, label: Thema, type: select, options: { values: [Lenkdrachen, Lenkmatten, Zubehör, Kinderdrachen, Reparatur] } }
      - { name: text, label: Kurzbeschreibung, type: text }

  - name: bewertungen
    label: "⭐ Bewertungen"
    type: file
    path: src/data/bewertungen.json
    format: json
    fields:
      - { name: stand, label: "Stand (Datum der Zahlen)", type: string }
      - name: google
        label: Google-Werte je Laden
        type: object
        list: true
        fields:
          - { name: laden, label: "Laden-ID (hooksiel/schillig)", type: string }
          - { name: sterne, label: Sterne, type: number }
          - { name: anzahl, label: Anzahl Rezensionen, type: number }
          - { name: themen, label: "Häufig erwähnt", type: string, list: true }
      - name: zitate
        label: Kundenzitate
        type: object
        list: true
        fields:
          - { name: text, label: Zitat, type: text }
          - { name: name, label: Name, type: string }

  - name: faq
    label: "❓ FAQ"
    type: file
    path: src/data/faq.json
    format: json
    list: true
    fields:
      - { name: frage, label: Frage, type: string }
      - { name: antwort, label: Antwort, type: text }

  - name: sortiment
    label: "🛍️ Sortiment"
    type: file
    path: src/data/sortiment.json
    format: json
    list: true
    fields:
      - { name: titel, label: Titel, type: string }
      - { name: bild, label: Bild, type: image }
      - { name: text, label: Text, type: text }
      - { name: hinweis, label: "Hinweis (z. B. nur in Schillig)", type: string }
      - { name: link, label: "Link (optional)", type: string }

  - name: uebersetzungen
    label: "🌍 Englisch & Niederländisch"
    type: file
    path: src/data/uebersetzungen.json
    format: json
    fields:
      - name: en
        label: English
        type: object
        fields: &sprachfelder
          - { name: titel, label: Seitentitel, type: string }
          - { name: beschreibung, label: Beschreibung, type: text }
          - { name: hero, label: Einleitung, type: text }
          - { name: laedenTitel, label: "Überschrift Läden", type: string }
          - name: laeden
            label: Ladentexte
            type: object
            fields:
              - { name: hooksiel, label: Hooksiel, type: text }
              - { name: schillig, label: Schillig, type: text }
          - { name: sortimentTitel, label: "Überschrift Sortiment", type: string }
          - { name: sortiment, label: Sortiment, type: string, list: true }
          - { name: drachenTitel, label: "Überschrift Drachen", type: string }
          - { name: drachenText, label: "Text Drachen", type: text }
          - { name: kontaktTitel, label: "Überschrift Kontakt", type: string }
          - { name: kontaktText, label: "Text Kontakt", type: text }
          - { name: deutsch, label: "Link zur deutschen Seite", type: string }
      - name: nl
        label: Nederlands
        type: object
        fields: *sprachfelder
