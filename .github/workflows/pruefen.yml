# Prüft jeden Änderungsvorschlag (Pull Request), z. B. von ChatGPT/Codex oder Claude, bevor er übernommen wird.
# Als Pflicht-Prüfung für main eingetragen (Regel „main schützen“, siehe Dokument 05 Konten).
name: Prüfen

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Typen und Astro prüfen
        run: npm run check
      - name: Seite bauen
        run: npm run build
