# VORÜBERGEHENDE Vorschau auf GitHub Pages (für die Abstimmung mit Nicky).
# GitHub Pages ist laut GitHub nicht als Hosting für Geschäftswebsites gedacht → nach dem Termin wieder abschalten:
#   gh workflow disable "Vorschau (GitHub Pages)" -R timschonfeld/dieschatullen
#   gh api -X DELETE repos/timschonfeld/dieschatullen/pages
# Dauerhafte Vorschau ist das Staging neu.dieschatullen.de (deploy.yml).
name: Vorschau (GitHub Pages)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_NOINDEX: '1'
          PUBLIC_WIND_DIREKT: '1' # kein PHP auf GitHub Pages → Drachenwetter fragt Bright Sky direkt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
