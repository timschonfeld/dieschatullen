# Live-Deploy auf Hetzner Webhosting: jeder Push auf "main" baut die Seite und spiegelt dist/ per SFTP.
# Benötigte Repository-Secrets: HETZNER_HOST, HETZNER_USER, HETZNER_PASSWORD, HETZNER_PATH (z. B. /public_html/dieschatullen)
name: Live (Hetzner)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *' # täglich neu bauen (Winterpause, News-Ablauf)

concurrency:
  group: hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten vorhanden?
        id: check
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "Keine Hetzner-Secrets hinterlegt, Deploy übersprungen."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.check.outputs.ok == 'true'
        run: npm ci && npm run build
        env:
          PUBLIC_WIND_PROXY: '1'
      - if: steps.check.outputs.ok == 'true'
        name: Upload per SFTP
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          PASS: ${{ secrets.HETZNER_PASSWORD }}
          ZIEL: ${{ secrets.HETZNER_PATH }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; mirror --reverse --delete --verbose --exclude-glob .git* --exclude api/.cache/ dist/ $ZIEL; bye"
