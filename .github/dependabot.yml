# Wöchentliche Updates für npm-Pakete und GitHub Actions (Pull Requests auf dev)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      alle: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
